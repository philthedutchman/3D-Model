<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reese Residence – 3D Model</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #222; background: #e9e7e3; }
    .app { display: flex; height: 100%; }
    #viewer { flex: 1; position: relative; min-width: 0; }
    #viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #666; font-size: 15px; pointer-events: none; }
    .hint { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; color: #777; font-size: 13px; pointer-events: none; }

    .panel { width: 260px; flex: none; background: #fff; border-left: 1px solid #d8d5cf; padding: 18px 16px; overflow-y: auto; }
    .panel h1 { font-size: 16px; margin: 0 0 2px; }
    .panel .sub { font-size: 12px; color: #777; margin: 0 0 16px; }
    .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #888; margin: 0 0 8px; font-weight: 600; }
    .layer { display: flex; align-items: center; gap: 10px; padding: 10px 10px; border: 1px solid #e3e0da; border-radius: 8px; margin-bottom: 8px; cursor: pointer; user-select: none; }
    .layer:hover { background: #f7f6f3; }
    .layer input { width: 18px; height: 18px; margin: 0; accent-color: #3d6b8f; cursor: pointer; }
    .layer .name { font-size: 14px; font-weight: 500; }
    .layer .desc { font-size: 12px; color: #888; }
    .layer.off .name { color: #999; }
    .views { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 16px; }
    .views button { font: inherit; font-size: 13px; padding: 8px 6px; border: 1px solid #d8d5cf; background: #fafaf8; border-radius: 6px; cursor: pointer; }
    .views button:hover { background: #f0eee9; }
    .views button.wide { grid-column: span 2; }

    #pick { position: absolute; z-index: 5; background: #fff; border: 1px solid #d8d5cf; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.15); padding: 10px 12px; min-width: 170px; display: none; }
    #pick .t { font-size: 12px; color: #888; margin-bottom: 2px; }
    #pick .n { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    #pick .d { font-size: 13px; color: #666; margin-bottom: 10px; min-height: 2px; }
    #pick .row { display: flex; gap: 6px; }
    #pick button { font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 6px; border: 1px solid #d8d5cf; background: #fafaf8; cursor: pointer; }
    #pick button.go { background: #3d6b8f; border-color: #3d6b8f; color: #fff; flex: 1; }
    #toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: #2b2b2b; color: #fff; border-radius: 8px; padding: 8px 8px 8px 14px; font-size: 14px; display: none; align-items: center; gap: 10px; z-index: 6; }
    #toast button { font: inherit; font-size: 13px; background: none; border: 1px solid #777; color: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; }

    @media (max-width: 700px) {
      .app { flex-direction: column; }
      .panel { width: auto; border-left: none; border-top: 1px solid #d8d5cf; padding: 12px; max-height: 42vh; }
      .panel .sub, .panel h1 { display: none; }
      .layers { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .layer { margin: 0; padding: 8px; }
      .layer .desc { display: none; }
      .views { margin-top: 8px; grid-template-columns: repeat(3, 1fr); }
      .views button.wide { grid-column: auto; }
    }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
<div class="app">
  <div id="viewer">
    <div id="status">Loading model…</div>
    <div id="pick">
      <div class="t">You clicked</div>
      <div class="n" id="pickName"></div>
      <div class="d" id="pickDetail"></div>
      <div class="row"><button class="go" id="pickRemove">Remove</button><button id="pickCancel" aria-label="Close">✕</button></div>
    </div>
    <div id="toast"><span id="toastText"></span><button id="toastUndo">Undo</button></div>
    <div class="hint">Tap a room to see its name, or a part of the house to remove it · drag to rotate · pinch or scroll to zoom</div>
  </div>

  <aside class="panel">
    <h1>Reese Residence</h1>
    <p class="sub">1437 Hollowside Way, Prescott AZ</p>
    <h2>Layers</h2>
    <div class="layers">
      <label class="layer"><input type="checkbox" data-layer="LAYER_ROOF" checked>
        <span><div class="name">Roof</div><div class="desc">Trusses, sheathing, tile</div></span></label>
      <label class="layer"><input type="checkbox" data-layer="LAYER_MAIN" checked>
        <span><div class="name">Main floor</div><div class="desc">Walls, doors, windows, fixtures</div></span></label>
      <label class="layer"><input type="checkbox" data-layer="LAYER_FLOORSYS" checked>
        <span><div class="name">Floor system</div><div class="desc">Main-floor joists &amp; subfloor</div></span></label>
      <label class="layer"><input type="checkbox" data-layer="LAYER_LOWER" checked>
        <span><div class="name">Lower floor</div><div class="desc">Foundation &amp; lower level</div></span></label>
    </div>
    <div class="views">
      <button data-preset="all" class="wide">Whole house</button>
      <button data-preset="main">See main floor</button>
      <button data-preset="lower">See lower floor</button>
    </div>
  </aside>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const box = document.getElementById('viewer');
const status = document.getElementById('status');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
box.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e7e3);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8478, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(1, 2, 1.2);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;

function resize() {
  const w = box.clientWidth, h = box.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(box);
resize();

const layers = {};
const layerMats = {};
const rooms = [];
const NAMES = { LAYER_ROOF: 'Roof', LAYER_MAIN: 'Main floor', LAYER_FLOORSYS: 'Floor system', LAYER_LOWER: 'Lower floor', LAYER_SITE: 'Ground' };
const draco = new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
const loader = new GLTFLoader().setDRACOLoader(draco);

loader.load('reese_layers.glb?v=32', (gltf) => {
  const model = gltf.scene;
  scene.add(model);
  for (const name of ['LAYER_ROOF', 'LAYER_MAIN', 'LAYER_FLOORSYS', 'LAYER_LOWER', 'LAYER_SITE']) {
    layers[name] = model.getObjectByName(name);
    const cache = new Map();
    layers[name]?.traverse(o => {
      o.userData.layer = name;
      if (o.isMesh) {
        const swap = m => { if (!cache.has(m)) { const c = m.clone(); c.userData.baseEmissive = c.emissive ? c.emissive.clone() : null; cache.set(m, c); } return cache.get(m); };
        o.material = Array.isArray(o.material) ? o.material.map(swap) : swap(o.material);
      }
    });
    layerMats[name] = [...cache.values()];
  }
  model.traverse(o => {
    if (o.isMesh && o.name.startsWith('ROOM') && o.userData.room) {
      o.material = o.material.clone();
      o.userData.baseColor = o.material.color.clone();
      if (o.userData.exterior) o.material.visible = false;   // porch/patio zones: still tappable, not drawn (owner 11/18)
      rooms.push(o);
    }
  });
  // frame the house
  const bounds = new THREE.Box3();
  for (const n of ['LAYER_ROOF', 'LAYER_MAIN', 'LAYER_FLOORSYS', 'LAYER_LOWER']) { const o = model.getObjectByName(n); if (o) bounds.expandByObject(o); }
  if (bounds.isEmpty()) bounds.setFromObject(model);
  const size = bounds.getSize(new THREE.Vector3());
  const center = bounds.getCenter(new THREE.Vector3());
  const dist = Math.max(size.x, size.z) * 1.15 / Math.min(1, Math.pow(camera.aspect, 0.7));
  camera.position.set(center.x + dist * 0.7, center.y + dist * 0.75, center.z + dist * 0.8);
  camera.near = dist / 200; camera.far = dist * 20; camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
  sun.position.set(center.x + dist, center.y + dist * 2, center.z + dist * 0.6);
  sun.target.position.copy(center); scene.add(sun.target);
  status.remove();
  if (!layers.LAYER_ROOF) console.warn('Model has no layer groups');
  applyCheckboxes();
}, (e) => {
  if (e.total) status.textContent = `Loading model… ${Math.round(e.loaded / e.total * 100)}%`;
}, (err) => {
  status.textContent = 'Could not load the model.';
  console.error(err);
});

const boxes = [...document.querySelectorAll('input[data-layer]')];
function applyCheckboxes() {
  if (typeof closePick === 'function' && pick.style.display === 'block') closePick();
  for (const cb of boxes) {
    const obj = layers[cb.dataset.layer];
    if (obj) obj.visible = cb.checked;
    cb.closest('.layer').classList.toggle('off', !cb.checked);
  }
}
boxes.forEach(cb => cb.addEventListener('change', applyCheckboxes));

const presets = {
  all:   { LAYER_ROOF: true,  LAYER_MAIN: true,  LAYER_FLOORSYS: true,  LAYER_LOWER: true, LAYER_SITE: true },
  main:  { LAYER_ROOF: false, LAYER_MAIN: true,  LAYER_FLOORSYS: true,  LAYER_LOWER: true, LAYER_SITE: false },
  lower: { LAYER_ROOF: false, LAYER_MAIN: false, LAYER_FLOORSYS: false, LAYER_LOWER: true, LAYER_SITE: false },
};
document.querySelectorAll('[data-preset]').forEach(btn => btn.addEventListener('click', () => {
  const p = presets[btn.dataset.preset];
  boxes.forEach(cb => cb.checked = p[cb.dataset.layer]);
  applyCheckboxes();
}));

// ---------- click a part of the house ----------
const pick = document.getElementById('pick');
const ray = new THREE.Raycaster();
let downAt = null, picked = null;

function highlight(name, on) {
  for (const m of layerMats[name] || []) {
    if (!m.emissive) continue;
    if (on) m.emissive.setRGB(0.35, 0.18, 0.0); else m.emissive.copy(m.userData.baseEmissive);
  }
}
let pickedRoom = null;
function roomHighlight(r, on) {
  if (!r) return;
  const m = r.material;
  if (on) { r.userData.baseMap ??= m.map; m.map = null; m.color.set(0xf2a33a); m.emissive?.set(0x5a3000); m.visible = true; }
  else { m.map = r.userData.baseMap ?? m.map; m.color.copy(r.userData.baseColor); m.emissive?.set(0x000000); if (r.userData.exterior) m.visible = false; }
  m.needsUpdate = true;
}
// Which room is this point in? Look straight down from it for the nearest visible room floor.
const down = new THREE.Raycaster();
function roomAt(point) {
  const visibleRooms = rooms.filter(r => { let o = r; while (o) { if (!o.visible) return false; o = o.parent; } return true; });
  down.far = 4.5;                                   // about one storey
  // try the exact spot first, then nudge outward so clicks on walls and edges still find the room
  for (const r of [0, 0.25, 0.5]) {
    const offsets = r === 0 ? [[0, 0]] : [[r, 0], [-r, 0], [0, r], [0, -r], [r, r], [-r, r], [r, -r], [-r, -r]];
    for (const [dx, dz] of offsets) {
      down.set(point.clone().add(new THREE.Vector3(dx, 0.05, dz)), new THREE.Vector3(0, -1, 0));
      const hit = down.intersectObjects(visibleRooms, false)[0];
      if (hit) return hit.object;
    }
  }
  return null;
}
function closePick() {
  if (picked) highlight(picked, false);
  roomHighlight(pickedRoom, false);
  picked = null; pickedRoom = null; pick.style.display = 'none';
}
renderer.domElement.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  const quick = performance.now() - downAt.t < 600;
  downAt = null;
  if (moved > 6 || !quick) return;              // that was a drag, not a click
  const r = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const visibleMeshes = [];
  scene.traverseVisible(o => { if (o.isMesh && o.userData.layer) visibleMeshes.push(o); });
  const hit = ray.intersectObjects(visibleMeshes, false)[0];
  closePick();
  if (!hit) return;
  picked = hit.object.userData.layer;
  pickedRoom = picked === 'LAYER_ROOF' ? null : (hit.object.name.startsWith('ROOM') ? hit.object : roomAt(hit.point));
  const nameEl = document.getElementById('pickName'), detailEl = document.getElementById('pickDetail');
  if (pickedRoom) {
    const u = pickedRoom.userData;
    roomHighlight(pickedRoom, true);
    nameEl.textContent = u.room;
    const bits = [];
    if (u.area_sf) bits.push(Math.round(u.area_sf) + ' sq ft');
    if (u.ceiling) bits.push(u.ceiling.replace(/\s*CEILING/i, '').trim() + ' ceiling');
    bits.push(u.level === 'LL' ? 'Lower floor' : 'Main floor');
    detailEl.textContent = bits.join(' · ');
  } else {
    highlight(picked, true);
    nameEl.textContent = NAMES[picked];
    detailEl.textContent = '';
  }
  document.getElementById('pickRemove').textContent = 'Remove ' + NAMES[picked].toLowerCase();
  pick.style.display = 'block';
  const bw = box.clientWidth, bh = box.clientHeight, pw = pick.offsetWidth, ph = pick.offsetHeight;
  let x = e.clientX - r.left + 12, y = e.clientY - r.top + 12;
  if (x + pw > bw - 8) x = e.clientX - r.left - pw - 12;
  if (y + ph > bh - 8) y = e.clientY - r.top - ph - 12;
  pick.style.left = Math.max(8, x) + 'px'; pick.style.top = Math.max(8, y) + 'px';
});
document.getElementById('pickCancel').addEventListener('click', closePick);
document.getElementById('pickRemove').addEventListener('click', () => {
  const name = picked; closePick();
  setLayer(name, false);
  showToast(NAMES[name] + ' removed', () => setLayer(name, true));
});
controls.addEventListener('start', () => { if (picked) closePick(); });

function setLayer(name, on) {
  const cb = boxes.find(c => c.dataset.layer === name);
  cb.checked = on; applyCheckboxes();
}
const toast = document.getElementById('toast');
let toastTimer, undoFn;
function showToast(text, undo) {
  document.getElementById('toastText').textContent = text;
  undoFn = undo; toast.style.display = 'flex';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.style.display = 'none', 5000);
}
document.getElementById('toastUndo').addEventListener('click', () => { undoFn && undoFn(); toast.style.display = 'none'; });

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>

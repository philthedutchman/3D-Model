<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Home Model for Trades</title>
  <script type="module" src="https://googleapis.com"></script>
  <style>
    body { margin: 0; background-color: #e5e5e5; }
    model-viewer { width: 100vw; height: 100vh; }
  </style>
</head>
<body>

  <model-viewer 
    src="./home.glb" 
    alt="3D model of the home" 
    camera-controls 
    auto-rotate
    shadow-intensity="1"
    exposure="1.2"
    environment-image="neutral">
  </model-viewer>

</body>
</html>
